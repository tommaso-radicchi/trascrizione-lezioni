[project]
name = "trascrizione-lezioni"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tommaso", email = "tommaso5462@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

